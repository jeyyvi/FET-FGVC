dataset:
  txt_dir: "./datasets/CUB_200_2011/"
  num_classes: 200

backbone:
  drop_rate: 0.0
  drop_path_rate: 0.0
  attn_drop_rate: 0.0
  pretrain_root: "/content/FET-FGVC/pretrained/"

train:
  stage: train
  warmup_epochs: 10
  log_step: 50
  backbone_lr: 1e-5
  others_lr: 5e-5
  betas: [0.9, 0.999]
  weight_decay: 0.01
  num_workers: 2

val:
  stage: val
  num_workers: 2

test:
  stage: val
  batch_size: 50
